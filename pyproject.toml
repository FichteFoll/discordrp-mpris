[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "discordrp-mpris"
version = "0.4.0"
description = "Discord Rich Presence based on mpris2 media players"
authors = [{name = "FichteFoll", email = "fichtefoll2@googlemail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    # See https://pypi.python.org/pypi?%3Aaction=list_classifiers
    'Development Status :: 4 - Beta',
    'Environment :: No Input/Output (Daemon)',
    'Intended Audience :: End Users/Desktop',
    'Operating System :: Unix',
    'Topic :: Communications :: Chat',
    
]
dependencies = [
    "dbussy>=1.3",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
discordrp-mpris = "discordrp_mpris.__main__:main"

[project.urls]
"Homepage" = "https://github.com/FichteFoll/discordrp-mpris"

[tool.hatch.build.targets.wheel]
packages = ["discordrp_mpris", "discord_rpc", "ampris2"]
